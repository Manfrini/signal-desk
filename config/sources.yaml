# Catalogo delle fonti (seed).
#
# Al primo avvio viene migrato una sola volta in data/sources.json, che da quel
# momento è il file che l'app legge: aggiungi, modifica o attiva le fonti dalla
# tab "Fonti" della dashboard, oppure editando direttamente quel JSON.
#
# Tutte le fonti qui elencate sono state verificate con:
#     python scripts/verify_sources.py
# (scarica + parsa + almeno un contenuto + pubblicazione recente).
# Solo alcune sono attive di default, per un primo avvio rapido.

