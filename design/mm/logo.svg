<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Monogramma MM — design system Marco Manfrini -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0F4C81"/>
  <!-- prima M (bianca) -->
  <path d="M 12 44 L 12 22 L 20 36 L 28 22 L 28 44"
        fill="none" stroke="#FFFFFF" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- seconda M (azzurro chiaro, sfalsata: la doppia identità product+data) -->
  <path d="M 36 44 L 36 22 L 44 36 L 52 22 L 52 44"
        fill="none" stroke="#7FB3E3" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
